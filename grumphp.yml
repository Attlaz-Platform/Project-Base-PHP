parameters:
    git_dir: .
    bin_dir: vendor/bin
    tasks:
        phpstan:
            level: 7
            ignore_patterns: ["*Test.php"]

        phpcs:
            standard: PSR2
            ignore_patterns: ["*Test.php"]

        phplint:
            exclude: []
            jobs: ~
            short_open_tag: false
            ignore_patterns: ["*Test.php"]
            triggered_by: ['php']
